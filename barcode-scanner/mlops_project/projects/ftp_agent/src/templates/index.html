
<!DOCTYPE html>
<html>
<head>
    <title>FTP AI Assistant</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; }
        #chat { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { text-align: right; color: blue; margin: 5px; }
        .bot { text-align: left; color: green; margin: 5px; }
        #question { width: 80%; padding: 10px; }
        button { padding: 10px; }
    </style>
</head>
<body>
<h1>FTP AI Assistant</h1>
<div id="chat"></div>
<input type="text" id="question" placeholder="Задайте вопрос...">
<button onclick="sendQuestion()">Отправить</button>
<script>
    async function sendQuestion() {
        const question = document.getElementById('question').value;
        if (!question) return;
        addMessage(question, 'user');
        document.getElementById('question').value = '';
        const response = await fetch('/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: question })
        });
        const data = await response.json();
        addMessage(data.answer, 'bot');
    }
    function addMessage(text, sender) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = sender;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
