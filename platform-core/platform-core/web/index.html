<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Платформа</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://widget.cloudpayments.ru/bundles/cloudpayments.legacy.js"></script>
</head>

<body>
    <div id="app">
        <!-- Заголовок -->
        <div class="header">
            <h1>🛠️ Партнёр</h1>
        </div>
        <div style="position:absolute;top:16px;right:16px;display:flex;gap:8px;">
            <button id="btn-notif-toggle" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:#8b6b4b;"
                    onclick="toggleNotifications()" title="Вкл/выкл уведомления">🔕</button>
            <button id="btn-notif-list" style="background:none;border:none;font-size:1.4rem;cursor:pointer;color:#cd7f32;"
                    onclick="showNotifications()" title="Список уведомлений">🔔</button>
            <button class="btn btn-link" onclick="showInfo()">ℹ️ Информация</button>
        </div>

        <!-- Экран: выбор роли -->
        <div id="screen-role" class="screen active">
            <p class="subtitle">Выберите вашу роль:</p>
            <button class="btn btn-primary" onclick="enterAs('customer')">👤 Я заказчик</button>
            <button class="btn btn-secondary" onclick="enterAs('executor')">🔧 Я исполнитель</button>
        </div>

        <!-- Экран: вход заказчика -->
        <div id="screen-reg-customer" class="screen">
            <p class="subtitle">Вход для заказчика</p>
            <input type="text" id="login-customer" placeholder="Логин" autocomplete="username">
            <input type="password" id="password-customer" placeholder="Пароль" autocomplete="current-password">
            <button class="btn btn-primary" onclick="loginCustomer()">Войти</button>
            <button class="btn btn-link" onclick="showRegisterForm('customer')">Регистрация</button>
            <button class="btn btn-link" onclick="goTo('screen-role')">← Назад</button>
        </div>

        <!-- Экран: вход исполнителя -->
        <div id="screen-reg-executor" class="screen">
            <p class="subtitle">Вход для исполнителя</p>
            <input type="text" id="login-executor" placeholder="Логин" autocomplete="username">
            <input type="password" id="password-executor" placeholder="Пароль" autocomplete="current-password">
            <button class="btn btn-secondary" onclick="loginExecutor()">Войти</button>
            <button class="btn btn-link" onclick="showRegisterForm('executor')">Регистрация</button>
            <button class="btn btn-link" onclick="goTo('screen-role')">← Назад</button>
        </div>

        <!-- Экран: регистрация -->
        <div id="screen-register" class="screen">
            <p class="subtitle" id="register-title"></p>
            <input type="text" id="reg-name" placeholder="Ваше имя">
            <input type="tel" id="reg-phone" placeholder="Телефон">
            <input type="text" id="reg-login" placeholder="Придумайте логин">
            <input type="password" id="reg-password" placeholder="Придумайте пароль">
            <div id="reg-executor-fields" style="display:none;">
                <input type="text" id="reg-inn" placeholder="ИНН (12 цифр)">
                <input type="text" id="reg-card" placeholder="Номер карты (16 цифр)">
            </div>
            <button class="btn btn-primary" id="reg-submit-btn" onclick="submitRegister()">Зарегистрироваться</button>
            <button class="btn btn-link" onclick="goBack()">← Назад</button>
        </div>

        <!-- Экран: меню заказчика -->
        <div id="screen-customer-menu" class="screen">
            <p class="subtitle" id="customer-greeting"></p>
            <button class="btn btn-primary" onclick="showCreateOrder()">📝 Создать заказ</button>
            <button class="btn btn-outline" onclick="showMyOrders()">📋 Мои заказы</button>
            <button class="btn btn-link" onclick="logout()">Выйти</button>

        </div>

        <!-- Экран: создание заказа -->
        <div id="screen-create-order" class="screen">
            <p class="subtitle">Новый заказ</p>
            <textarea id="order-description" placeholder="Опишите, что нужно сделать..."></textarea>
            <input type="number" id="order-amount" placeholder="Сумма в рублях" min="1" step="1">
            <button class="btn btn-primary" onclick="createOrder()">Создать и внести предоплату</button>
            <button class="btn btn-link" onclick="goTo('screen-customer-menu')">← Назад</button>
        </div>

        <!-- Экран: меню исполнителя -->
        <div id="screen-executor-menu" class="screen">
            <p class="subtitle" id="executor-greeting"></p>
            <button class="btn btn-secondary" onclick="showAvailableOrders()">🔍 Доступные заказы</button>
            <button class="btn btn-outline" onclick="showMyOrders()">📋 Мои заказы</button>
            <button class="btn btn-outline" onclick="showStats()">📊 Статистика</button>
            <button class="btn btn-link" onclick="logout()">Выйти</button>

        </div>

        <!-- Экран: уведомления -->
        <div id="screen-notifications" class="screen">
            <p class="subtitle">🔔 Уведомления</p>
            <div id="notifications-list"></div>
            <button class="btn btn-link" onclick="goBack()">← Назад</button>
            <button class="btn btn-link" style="color:#8b0000;" onclick="clearNotifications()">🗑 Очистить все</button>
        </div>

        <!-- Экран: список заказов -->
        <div id="screen-orders" class="screen">
            <p class="subtitle">Заказы</p>
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <button class="btn btn-outline btn-sm" style="width:auto;" onclick="refreshOrders('all')">Все</button>
                <button class="btn btn-outline btn-sm" style="width:auto;" onclick="refreshOrders('today')">Сегодня</button>
            </div>
            <div id="orders-list"></div>
            <button class="btn btn-link" onclick="goBack()">← Назад</button>
        </div>

        <!-- Экран: оценка -->
        <div id="screen-review" class="screen">
            <p class="subtitle">Оценить исполнителя</p>
            <div class="stars" id="stars-container">
                <span onclick="setRating(1)">☆</span>
                <span onclick="setRating(2)">☆</span>
                <span onclick="setRating(3)">☆</span>
                <span onclick="setRating(4)">☆</span>
                <span onclick="setRating(5)">☆</span>
            </div>
            <input type="text" id="review-comment" placeholder="Комментарий (необязательно)">
            <button class="btn btn-primary" onclick="submitReview()">Отправить</button>
            <button class="btn btn-link" onclick="goBack()">← Назад</button>
        </div>

        <!-- Экран: статистика -->
        <div id="screen-stats" class="screen">
            <p class="subtitle">📊 Статистика</p>
            <div id="stats-content"></div>
            <button class="btn btn-link" onclick="goBack()">← Назад</button>
        </div>

        <!-- Экран: Чат -->
        <div id="screen-chat" class="screen">
            <p class="subtitle">Чат по заказу <span id="chat-order-id"></span></p>
            <div id="chat-messages" style="max-height:400px;overflow-y:auto;margin-bottom:12px;"></div>
            <div style="display:flex;gap:8px;">
                <input type="text" id="chat-input" placeholder="Сообщение..." style="flex:1;">
                <button class="btn btn-primary" style="width:auto;padding:14px 20px;" onclick="sendChatMessage()">→</button>
            </div>
            <button class="btn btn-link" onclick="goBack()">← Назад к заказу</button>
        </div>

        <!-- Уведомление -->
        <div id="toast" class="toast"></div>


    </div>

    <script src="/static/app.js"></script>

</body>
</html>
